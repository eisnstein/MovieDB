server {
    listen 8082 default_server;

    root /usr/share/nginx/html;

    # index.html and other unhashed files are revalidated on every load,
    # so a new deploy is picked up right away
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Vite puts a content hash in its output file names (e.g. index-B2nRZlfv.js),
    # so these never change and can be cached for good
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.[a-z0-9]+$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
