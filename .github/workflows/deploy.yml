name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - image: moviedb-api
            context: MovieDB.Api
          - image: moviedb-frontend
            context: MovieDB.Client
    steps:
      - uses: actions/checkout@v7

      - if: matrix.image == 'moviedb-frontend'
        uses: actions/setup-node@v7
        with:
          node-version-file: MovieDB.Client/.nvmrc
          cache: npm
          cache-dependency-path: MovieDB.Client/package-lock.json

      - if: matrix.image == 'moviedb-frontend'
        working-directory: MovieDB.Client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_OMDB_API_KEY: ${{ secrets.VITE_OMDB_API_KEY }}
        run: |
          npm ci
          npm run build

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/eisnstein/${{ matrix.image }}:latest
            ghcr.io/eisnstein/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy redeploy
        run: curl -fsS -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
